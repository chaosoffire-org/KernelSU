name: Build A5560 Manager

on:
  push:
    branches: [device/a5560zj1]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Show preinstalled SDK
        run: |
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/cmake" || true

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > key.jks
          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: ./gradlew clean assembleRelease

      - name: Upload gradle manager
        uses: actions/upload-artifact@v4
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

  build-ksud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust target
        run: rustup target add aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud
          cache-targets: false

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml

      - name: Upload ksud
        uses: actions/upload-artifact@v4
        with:
          name: ksud-aarch64-linux-android
          path: target/aarch64-linux-android/release/ksud

  repack:
    needs: [build-manager, build-ksud]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download gradle manager
        uses: actions/download-artifact@v4
        with:
          name: manager-gradle
          path: artifacts/manager-gradle

      - name: Download ksud
        uses: actions/download-artifact@v4
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Place manager and ksud
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          mkdir -p target/aarch64-linux-android/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          test -n "$APK"
          test -n "$KSUD"
          cp -f "$APK" manager/app/build/outputs/apk/release/
          cp -f "$KSUD" target/aarch64-linux-android/release/ksud

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 -d > key.jks

      - name: Repack and sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -K key.jks \
            -A "$KEY_ALIAS" \
            -P "$KEYSTORE_PASSWORD" \
            -S "$KEY_PASSWORD"

      - name: Verify APK
        run: |
          APK=$(find dist -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libksud.so"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-a5560-signed
          path: dist/*.apk
